<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CastChat Store2.0</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
color:#fff;
font-family:Segoe UI,Arial,sans-serif;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

h1{
font-size:32px;
color:#FFD700;
}

#loginBtn{
background:#FFD700;
color:#000;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

#perfil{
display:none;
font-size:14px;
}

#adminPanel{
display:none;
background:#1b1b1b;
padding:20px;
border-radius:15px;
margin-bottom:30px;
}

#adminPanel h2{
margin-bottom:15px;
color:#FFD700;
}

#adminPanel input{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:8px;
background:#2a2a2a;
color:white;
}

#publicarBtn{
background:#FFD700;
color:#000;
border:none;
padding:12px;
width:100%;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

#lista{
display:flex;
flex-direction:column;
gap:15px;
}

.card{
background:#1b1b1b;
border-radius:15px;
padding:15px;
display:flex;
gap:15px;
align-items:flex-start;
}

.card img{
width:90px;
height:90px;
border-radius:20px;
object-fit:cover;
flex-shrink:0;
}

.info{
flex:1;
display:flex;
flex-direction:column;
gap:10px;
}

.info h3{
margin-bottom:5px;
}

.botoes{
display:flex;
gap:10px;
}

.cancelar{
background:#444;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.entrar{
background:#FFD700;
color:black;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

a{
text-decoration:none;
}

#perfil{
display:none;
align-items:center;
gap:10px;
}

#perfilFoto{
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
}

#perfilNome{
font-size:14px;
font-weight:bold;
}

#perfilEmail{
font-size:12px;
color:#999;
}

#perfilInfo{
display:flex;
flex-direction:column;
}

header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:30px;
}

#logoutBtn{
  background:#ff3030;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}
  
</style>

</head>
<body>

<header>

<img src="castchatstore.png" alt="CastChat Store"   style="
      width:60px;
      height:60px;
      object-fit:contain;
    ">
  
<h1>CastChat Store2.0</h1>

<button id="loginBtn">
Faça Login
</button>

<div id="perfil">

  <img id="perfilFoto" src="">

  <div id="perfilInfo">

    <div id="perfilNome"></div>

    <div id="perfilEmail"></div>

  </div>

  <button id="logoutBtn">
    Sair
  </button>

</div>

</header>

<div id="adminPanel">

<h2>Criar Publicação</h2>

<input
type="text"
id="titulo"
placeholder="Nome da publicação">

<input
type="text"
id="icone"
placeholder="URL da imagem">

<input
type="text"
id="link"
placeholder="Link de entrada">

<label style="display:flex;align-items:center;gap:8px;margin-bottom:15px;">
<input
type="checkbox"
id="verificado">
Publicação verificada
</label>

<button id="publicarBtn">
Publicar
</button>

</div>

<div id="lista"></div>

<script>

// FIREBASE

const firebaseConfig = {
apiKey:"AIzaSyBAOQC_mEjF-m5fdEO2no1-XfsQUjZc2mU",
authDomain:"amongchat-848f9.firebaseapp.com",
projectId:"amongchat-848f9",
storageBucket:"amongchat-848f9.firebasestorage.app",
messagingSenderId:"317096866187",
appId:"1:317096866187:web:fc4be8871cc5a9e7f43f8e"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

document.getElementById("logoutBtn")
.onclick = async ()=>{

  try{

    await auth.signOut();

  }catch(err){

    console.error(err);

  }

};
  
// EMAIL ADMIN

const EMAIL_ADMIN =
"walysonoliveiraduarte1234@gmail.com";

// LOGIN GOOGLE

document
.getElementById("loginBtn")
.onclick = async ()=>{

const provider =
new firebase.auth.GoogleAuthProvider();

try{

await auth.signInWithPopup(provider);

}catch(err){

console.error(err);

}

};

// AUTH

auth.onAuthStateChanged(user=>{

const perfil =
document.getElementById("perfil");

const loginBtn =
document.getElementById("loginBtn");

if(!user){

perfil.style.display="none";

loginBtn.style.display="block";

document.getElementById("adminPanel")
.style.display="none";

return;

}

loginBtn.style.display="none";

perfil.style.display="flex";

document.getElementById("perfilFoto").src =
user.photoURL || "";

document.getElementById("perfilNome").textContent =
user.displayName || "Usuário";

document.getElementById("perfilEmail").textContent =
user.email || "";

if(user.email === EMAIL_ADMIN){

document
.getElementById("adminPanel")
.style.display="block";

}else{

document
.getElementById("adminPanel")
.style.display="none";

}

});

// PUBLICAR

document
.getElementById("publicarBtn")
.onclick = async ()=>{

console.log("BOTÃO PUBLICAR CLICADO");

try{

const titulo =
document
.getElementById("titulo")
.value
.trim();

const icone =
document
.getElementById("icone")
.value
.trim();

const link =
document
.getElementById("link")
.value
.trim();

if(!titulo || !link){

alert("Preencha tudo");

return;

}

await db
.collection("publicacoes")
.add({

  titulo,
  icone,
  link,

  verificado: false,

  criadoEm: Date.now()

});

console.log("PUBLICAÇÃO SALVA");

document
.getElementById("titulo")
.value = "";

document
.getElementById("icone")
.value = "";

document
.getElementById("link")
.value = "";

}catch(err){

console.error("ERRO FIRESTORE:", err);

alert(err.message);

}

};

// LISTA

db.collection("publicacoes")
.orderBy("criadoEm","desc")
.onSnapshot(snapshot=>{

  const lista =
    document.getElementById("lista");

  lista.innerHTML = "";

  snapshot.forEach(doc=>{

    const p = doc.data();

    lista.innerHTML += `

    <div class="card">

      <img src="${
        p.icone ||
        'https://via.placeholder.com/90'
      }">

      <div class="info">

        <h3 style="display:flex;align-items:center;gap:8px;">

          ${p.titulo}

          ${p.verificado ? `
          <img
            src="ic_settings_verify.png"
            style="
              width:18px;
              height:18px;
              border-radius:0;
              object-fit:contain;
            ">
          ` : ''}

        </h3>

        <div class="botoes">

          <button class="cancelar">
            Cancelar
          </button>

          <a
            href="${p.link}"
            target="_blank">

            <button class="entrar">
              Entrar
            </button>

          </a>

        </div>

      </div>

    </div>

    `;

  });

});

</script>

</body>
</html>

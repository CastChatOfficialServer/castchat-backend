<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CastChat - Idade</title>
<link rel="stylesheet" href="style.css">
</head>
<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
color:white;
}

/* FORMATO DE CELULAR */

.phone{

width:420px;
max-width:95%;
height:720px;

border-radius:20px;

background:#0b0b0b;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

box-shadow:0 0 40px rgba(0,0,0,0.8);

position:relative;

overflow:hidden;

padding:20px;

text-align:center;

}

/* TITULO */

.titulo{
font-size:36px;
font-weight:900;
}

.cast{
color:#ffd700;
}

.chat{
color:#ff3030;
}

.versao{
  font-size:50px;
  color:#ffffff;
  margin-top:4px;
  font-weight:700;
}

/* SUBTEXTO */

.sub{
margin-top:10px;
font-size:16px;
opacity:0.9;
}

/* BOTÃO */

.btn{

margin-top:25px;

padding:14px 25px;

border:none;
border-radius:10px;

font-size:18px;
font-weight:bold;

cursor:pointer;

background:#ffd700;
color:#000;

transition:0.2s;

}

.btn:hover{
transform:scale(1.05);
}

</style>
<body>
<div class="phone">
  <div class="titulo"><span class="cast">CAST</span><span class="chat">CHAT</span></div>
  <div class="versao">2.0</div>
  <p class="sub center">Quantos anos você tem?</p>

  <!-- Select de idade -->
  <select id="idadeSelect">
    <option value="">-- Selecione sua idade --</option>
  </select>

  <!-- Botão começa desativado -->
  <a id="confirmarLink" href="home.html">
    <button id="btnConfirmar" class="btn btn-desativado" disabled>Confirmar</button>
  </a>

  <a href="index.html">
    <button class="btn" style="background:transparent;color:var(--muted);">⬅ Voltar</button>
  </a>
</div>

<script>
  const idadeSelect = document.getElementById("idadeSelect");
  const btnConfirmar = document.getElementById("btnConfirmar");

  // Preencher opções de 15 a 100
  for (let i = 15; i <= 100; i++) {
    let opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i;
    idadeSelect.appendChild(opt);
  }

  // Ativar botão quando escolher idade
  idadeSelect.addEventListener("change", () => {
    if (idadeSelect.value) {
      btnConfirmar.disabled = false;
      btnConfirmar.classList.remove("btn-desativado");
      btnConfirmar.classList.add("btn-amarelo");
    } else {
      btnConfirmar.disabled = true;
      btnConfirmar.classList.remove("btn-amarelo");
      btnConfirmar.classList.add("btn-desativado");
    }
  });
</script>
</body>
</html>

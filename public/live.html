<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Lives</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Segoe UI,Arial,sans-serif;

  display:flex;
  justify-content:center;

  min-height:100vh;
}

.app{

  width:100%;
  max-width:420px;
  min-height:100vh;

  background:#000;
}

.header{

  padding:20px;

  text-align:center;

  border-bottom:
  1px solid #222;
}

.header h1{

  color:#FFD700;

  font-size:24px;
}

.criar-live{

  padding:15px;
}

#btnCriarLive{

  width:100%;
  height:50px;

  border:none;

  border-radius:12px;

  background:#FFD700;

  color:#000;

  font-weight:bold;

  cursor:pointer;
}

#btnCriarLive:disabled{

  background:#444;
  color:#999;
}

#listaLives{

  padding:15px;
}

.live-card{

  display:flex;

  align-items:center;

  gap:12px;

  background:#111;

  padding:12px;

  border-radius:12px;

  margin-bottom:10px;
}

.live-card img{

  width:50px;
  height:50px;

  border-radius:50%;

  object-fit:cover;
}

.live-info{

  flex:1;
}

.live-nome{

  font-weight:bold;
}

.live-card button{

  background:#FFD700;

  color:#000;

  border:none;

  border-radius:10px;

  padding:8px 12px;

  font-weight:bold;

  cursor:pointer;
}

#videoLive{

  width:100%;

  height:70vh;

  background:#000;

  object-fit:contain;

  display:block;

}

.live-topo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: #111;
}

#liveAvatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  object-fit: cover;
}

#liveNome {
  flex: 1;
  font-weight: bold;
  overflow-wrap: anywhere;
}

#btnSeguirLive {
  background: #FFD700;
  color: #000;
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  font-weight: bold;
  cursor: pointer;
}

#btnSeguirLive:disabled {
  opacity: 0.8;
  cursor: default;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <h1>Lives</h1>

  </div>

  <div class="criar-live">

    <button id="btnCriarLive">
      Criar Live
    </button>

  </div>

  <div id="listaLives"></div>

  <!-- TELA DA LIVE -->
  <div id="telaLive" style="display:none;">

    <div class="live-topo">

      <img
        id="liveAvatar"
        src="avatarpreto01.png"
      >

      <span id="liveNome">
        Streamer
      </span>

      <button id="btnSeguirLive">
        Seguir
      </button>

    </div>

    <video
      id="videoLive"
      autoplay
      playsinline
      muted
    ></video>

    <div id="chatLive"></div>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBAOQC_mEjF-m5fdEO2no1-XfsQUjZc2mU",
  authDomain: "amongchat-848f9.firebaseapp.com",
  projectId: "amongchat-848f9",
  storageBucket: "amongchat-848f9.firebasestorage.app",
  messagingSenderId: "317096866187",
  appId: "1:317096866187:web:fc4be8871cc5a9e7f43f8e",
  measurementId: "G-ZFE9C5E595"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();

const meuPerfilID = localStorage.getItem("perfilID");

if (!meuPerfilID) {
  console.error("perfilID não encontrado");
}

let souStreamer = false;
let liveAtual = null;

//=========================
// CONFERIR SELO STREAMER
//=========================
async function verificarPermissaoLive() {
  const btnCriarLive = document.getElementById("btnCriarLive");

  if (!btnCriarLive || !meuPerfilID) {
    return;
  }

  try {
    const doc = await db
      .collection("usuarios")
      .doc(String(meuPerfilID))
      .get();

    const dados = doc.data() || {};
    const selos = dados.selos || [];

    const podeCriar =
      selos.includes("streamer") ||
      String(meuPerfilID) === "10000";

    btnCriarLive.disabled = !podeCriar;

  } catch (error) {
    console.error("Erro ao verificar permissão de live:", error);
    btnCriarLive.disabled = true;
  }
}

//=======================
// CRIAR LIVE
//=======================
async function criarLive() {
  if (!meuPerfilID) {
    alert("Você precisa estar conectado ao seu perfil.");
    return;
  }

  try {
    souStreamer = true;

    const perfil = await db
      .collection("usuarios")
      .doc(String(meuPerfilID))
      .get();

    if (!perfil.exists) {
      alert("Seu perfil não foi encontrado.");
      return;
    }

    const dados = perfil.data() || {};
    const liveId = Date.now().toString();

    await db
      .collection("lives")
      .doc(liveId)
      .set({
        hostUid: String(meuPerfilID),

        hostNome:
          dados.nickname ||
          dados.nome ||
          "Streamer",

        hostAvatar:
          dados.avatarUpload ||
          dados.avatar ||
          dados.avatarEquipado ||
          "icon_profile_selected.png",

        viewers: 0,
        ativa: true,
        criadaEm: Date.now(),
        webrtc: true
      });

    await db
      .collection("lives")
      .doc(liveId)
      .collection("offers")
      .doc("main")
      .set({
        createdAt: Date.now()
      });

    await abrirLive(liveId);

    await criarOffer(liveId);

  } catch (error) {
    console.error("Erro ao criar live:", error);
    alert("Não foi possível criar a live.");
  }
}

//========================
// COMPARTILHAR TELA
//========================
async function iniciarCompartilhamentoTela() {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: true
    });

    // Envia as faixas da tela para o WebRTC
    stream.getTracks().forEach(track => {
      peerConnection.addTrack(track, stream);
    });

    const video = document.getElementById("videoLive");

    if (video) {
      video.srcObject = stream;
      await video.play();
    }

    console.log("Tela compartilhada");

  } catch (err) {
    console.error("Erro ao compartilhar tela:", err);
  }
}

//=====================
// BOTÃO CRIAR LIVE
//=====================
const btnCriarLive = document.getElementById("btnCriarLive");

if (btnCriarLive) {
  btnCriarLive.onclick = criarLive;
}

//===================
// CARREGAR LIVES
//===================
async function carregarLives() {
  const lista = document.getElementById("listaLives");

  if (!lista) {
    return;
  }

  lista.innerHTML = "";

  try {
    const snap = await db
      .collection("lives")
      .where("ativa", "==", true)
      .get();

    snap.forEach(doc => {
      const live = doc.data() || {};

      const card = document.createElement("div");
      card.className = "live-card";

      const img = document.createElement("img");
      img.src = live.hostAvatar || "avatarpreto01.png";
      img.width = 50;
      img.alt = "Foto de " + (live.hostNome || "Streamer");

      img.onerror = function () {
        this.onerror = null;
        this.src = "avatarpreto01.png";
      };

      const nome = document.createElement("b");
      nome.textContent = live.hostNome || "Streamer";

      const btnEntrar = document.createElement("button");
      btnEntrar.textContent = "Entrar";
      btnEntrar.onclick = () => entrarLive(doc.id);

      card.appendChild(img);
      card.appendChild(nome);
      card.appendChild(btnEntrar);

      lista.appendChild(card);
    });

  } catch (error) {
    console.error("Erro ao carregar lives:", error);
  }
}

//====================
// ENTRAR NA LIVE
//=====================
function entrarLive(id) {
  abrirLive(id);
}

//================
// INICIAR PÁGINA
//================
window.onload = async () => {
  await verificarPermissaoLive();
  await carregarLives();
};

//================
// ABRIR LIVE
//================
async function abrirLive(id) {
  try {
    liveAtual = String(id);

    // Busca os dados da live
    const liveDoc = await db
      .collection("lives")
      .doc(liveAtual)
      .get();

    if (!liveDoc.exists) {
      alert("Esta live não foi encontrada.");
      return;
    }

    const live = liveDoc.data() || {};

    // Confere se a live continua ativa
    if (live.ativa !== true) {
      alert("Esta live não está mais ativa.");
      return;
    }

    // Identifica o anfitrião
    const hostUid = String(live.hostUid || "");
    const meuID = String(meuPerfilID || "");

    const souHost =
      meuID !== "" &&
      hostUid !== "" &&
      meuID === hostUid;

    // Busca o perfil do anfitrião como alternativa
    let perfilHost = {};

    if (hostUid) {
      const perfilDoc = await db
        .collection("usuarios")
        .doc(hostUid)
        .get();

      if (perfilDoc.exists) {
        perfilHost = perfilDoc.data() || {};
      }
    }

    // Define a foto do anfitrião
    const avatar =
      live.hostAvatar ||
      perfilHost.avatarUpload ||
      perfilHost.avatar ||
      perfilHost.avatarEquipado ||
      "avatarpreto01.png";

    // Define o nome do anfitrião
    const nome =
      live.hostNome ||
      perfilHost.nickname ||
      perfilHost.nome ||
      perfilHost.name ||
      "Streamer";

    // Atualiza a identificação na tela
    const img = document.getElementById("liveAvatar");

    if (img) {
      img.src = avatar;
      img.alt = "Foto de " + nome;

      img.onerror = function () {
        this.onerror = null;
        this.src = "avatarpreto01.png";
      };
    }

    const liveNome = document.getElementById("liveNome");

    if (liveNome) {
      liveNome.textContent = nome;
    }

    // Atualiza a variável do anfitrião
    souStreamer = souHost;

    // Configura o botão de seguir
    const btnSeguirLive = document.getElementById("btnSeguirLive");

    if (btnSeguirLive) {
      if (souHost) {
        // O anfitrião não segue a si próprio
        btnSeguirLive.style.display = "none";
        btnSeguirLive.onclick = null;

      } else {
        btnSeguirLive.style.display = "inline-block";

        // Verifica se o espectador já segue o anfitrião
        await verificarSeSegueHost(hostUid);

        // Só permite clicar se ainda não estiver seguindo
        btnSeguirLive.onclick = seguirHostLive;
      }
    }

    // Esconde a lista de lives e o botão de criar
    const listaLives = document.getElementById("listaLives");

    if (listaLives) {
      listaLives.style.display = "none";
    }

    const btnCriarLive = document.querySelector(".criar-live");

    if (btnCriarLive) {
      btnCriarLive.style.display = "none";
    }

    // Mostra a tela da transmissão
    const telaLive = document.getElementById("telaLive");

    if (telaLive) {
      telaLive.style.display = "block";
    }

    console.log("Entrou na live:", id);
    console.log("É o anfitrião:", souHost);

    // Mantém o comportamento atual da transmissão
    if (souHost) {
      await iniciarCompartilhamentoTela();
    }

  } catch (error) {
    console.error("Erro ao abrir a live:", error);
    alert("Não foi possível abrir esta live. Tente novamente.");
  }
}

//=====================
// WEBRTC
//=====================
const peerConnection = new RTCPeerConnection({
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    }
  ]
});

//=====================
// OFFER WEBRTC
//=====================
async function criarOffer(liveId) {
  try {
    const offer = await peerConnection.createOffer();

    await peerConnection.setLocalDescription(offer);

    await db
      .collection("lives")
      .doc(String(liveId))
      .collection("offers")
      .doc("main")
      .set({
        type: offer.type,
        sdp: offer.sdp,
        criadaEm: Date.now()
      });

    console.log("Offer criada");

  } catch (error) {
    console.error("Erro ao criar offer:", error);
  }
}

//====================================
// VERIFICAR SE O ESPECTADOR SEGUE O HOST
//====================================
async function verificarSeSegueHost(hostUid) {
  const btn = document.getElementById("btnSeguirLive");

  if (!btn || !meuPerfilID || !hostUid) {
    return;
  }

  const meuId = String(meuPerfilID);
  const alvoId = String(hostUid);

  // O anfitrião não precisa seguir a própria conta
  if (meuId === alvoId) {
    btn.style.display = "none";
    btn.onclick = null;
    return;
  }

  btn.style.display = "inline-block";
  btn.disabled = true;
  btn.textContent = "Verificando...";

  try {
    const seguindoRef = db
      .collection("usuarios")
      .doc(meuId)
      .collection("seguindo")
      .doc(alvoId);

    const doc = await seguindoRef.get();

    if (doc.exists) {
      btn.textContent = "Seguindo";
      btn.disabled = true;
      btn.onclick = null;

    } else {
      btn.textContent = "Seguir";
      btn.disabled = false;
      btn.onclick = seguirHostLive;
    }

  } catch (error) {
    console.error("Erro ao verificar seguimento:", error);

    btn.textContent = "Seguir";
    btn.disabled = false;
    btn.onclick = seguirHostLive;
  }
}

//===============================
// SEGUIR HOST DA LIVE
//===============================
async function seguirHostLive() {
  const btn = document.getElementById("btnSeguirLive");

  if (!btn || !liveAtual || !meuPerfilID) {
    return;
  }

  try {
    btn.disabled = true;
    btn.textContent = "Aguarde...";

    const liveDoc = await db
      .collection("lives")
      .doc(String(liveAtual))
      .get();

    if (!liveDoc.exists) {
      alert("Esta live não foi encontrada.");
      btn.textContent = "Seguir";
      btn.disabled = false;
      return;
    }

    const live = liveDoc.data() || {};

    const meuId = String(meuPerfilID);
    const alvoId = String(live.hostUid || "");

    // Não permite seguir a própria conta
    if (!alvoId || meuId === alvoId) {
      btn.style.display = "none";
      btn.onclick = null;
      return;
    }

    const seguindoRef = db
      .collection("usuarios")
      .doc(meuId)
      .collection("seguindo")
      .doc(alvoId);

    const seguidorRef = db
      .collection("usuarios")
      .doc(alvoId)
      .collection("seguidores")
      .doc(meuId);

    // Confere novamente para evitar duplicação
    const jaSegue = await seguindoRef.get();

    if (jaSegue.exists) {
      btn.textContent = "Seguindo";
      btn.disabled = true;
      btn.onclick = null;
      return;
    }

    // Registra que estou seguindo o anfitrião
    await seguindoRef.set({
      uid: alvoId,
      criadoEm: Date.now()
    });

    // Registra que sou seguidor do anfitrião
    await seguidorRef.set({
      uid: meuId,
      criadoEm: Date.now()
    });

    // Atualiza os contadores dos perfis
    await db.runTransaction(async (tx) => {
      const meuRef = db
        .collection("usuarios")
        .doc(meuId);

      const alvoRef = db
        .collection("usuarios")
        .doc(alvoId);

      const meuDoc = await tx.get(meuRef);
      const alvoDoc = await tx.get(alvoRef);

      const followingAtual =
        Number(meuDoc.data()?.followingCount || 0);

      const followersAtual =
        Number(alvoDoc.data()?.followersCount || 0);

      tx.update(meuRef, {
        followingCount: followingAtual + 1
      });

      tx.update(alvoRef, {
        followersCount: followersAtual + 1
      });
    });

    // Atualiza o botão após seguir
    btn.textContent = "Seguindo";
    btn.disabled = true;
    btn.onclick = null;

  } catch (error) {
    console.error("Erro ao seguir host:", error);

    alert("Não foi possível seguir este perfil.");

    btn.textContent = "Seguir";
    btn.disabled = false;
    btn.onclick = seguirHostLive;
  }
}
</script>
</body>
</html>

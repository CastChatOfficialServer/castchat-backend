<style>
:root{
  --bg:#000;
  --card:#141414;
  --muted:#bbb;
  --yellow:#ffd700;
  --purple:#6f49ff;
}

html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
}

.app{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

/* Topbar */
.topbar{
  width:100%;
  max-width:420px;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111;
  border-bottom:1px solid #222;
}

.saldo{
  display:flex;
  gap:12px;
  align-items:center;
  font-weight:700;
}

.saldo img{
  width:18px;
  height:18px;
}

.saldo span{
  display:flex;
  align-items:center;
  gap:6px;
}

.close-btn{
  background:none;
  border:none;
  color:var(--yellow);
  font-weight:700;
  cursor:pointer;
}

/* Conteúdo */
.content{
  width:100%;
  max-width:420px;
  padding:12px 12px 24px;
  box-sizing:border-box;
}

h2.section{
  color:var(--yellow);
  text-align:left;
  margin:12px 0;
  font-size:16px;
}

/* Ovos */
.eggs-row{
  display:flex;
  gap:10px;
  justify-content:space-between;
  margin-bottom:14px;
}

.egg-card{
  flex:1;
  background:var(--card);
  border-radius:12px;
  text-align:center;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;

  min-height:140px;
  padding:10px;
}

.egg-card img.egg{
  width:64px;
  height:64px;
  object-fit:contain;
  margin:6px 0;
}

.price-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--purple);
  color:#fff;
  padding:6px 10px;
  border-radius:20px;
  font-weight:700;
  font-size:13px;
}

.price-pill img{
  width:14px;
  height:14px;
}

.egg-top-badge{
  position:absolute;
  left:8px;
  top:8px;
  background:rgba(255,255,255,0.12);
  padding:6px 10px;
  border-radius:10px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  z-index:999;
  pointer-events:all;
}

.eggs-row .egg-card[style]{
  max-width:160px;
}

/* Responsivo */
@media (max-width:360px){
  .egg-card img.egg{
    width:54px;
    height:54px;

    min-height:120px;

/* Diamonds */

  gap:12px;

  margin:12px 0;
}

.diamond-card{

  text-align:center;

.diamond-card img{

.buy-yellow{

.small-note{

const db = firebase.firestore();

let meuPerfilID = null;

async function carregarPerfilCompras(){

  const loginAtualDoc =
    await db.collection("config")
      .doc("loginAtual")
      .get();

  if (!loginAtualDoc.exists) return;

  const loginAtual = loginAtualDoc.data() || {};

  if (loginAtual.tipo === "google") {
    meuPerfilID = String(loginAtual.perfilID);
  }

  if (loginAtual.tipo === "discord") {
    meuPerfilID = String(loginAtual.uid);
  }

}

function iniciarCarteira(){

  if (!meuPerfilID) return;

  db.collection("usuarios")
    .doc(String(meuPerfilID))
    .onSnapshot(async (doc) => {

      if (!doc.exists) return;

      const data = doc.data() || {};

      const infinitoAtivo =
        String(meuPerfilID) === "10000" &&
        String(data.discordID) === "908775623135219734" &&
        data.infinito === true;

      let coins = Number(data.coins || 0);
      let diamonds = Number(data.diamonds || 0);
      let orbs = Number(data.discordOrbs || 0);

      if (infinitoAtivo) {
        coins = 999999;
        diamonds = 999999;
        orbs = 999999;

        await db.collection("usuarios")
          .doc("10000")
          .set({
            coins: 999999,
            diamonds: 999999,
            discordOrbs: 999999
          }, { merge:true });
      }

      const coinEl = document.getElementById("coins");
      const diamondEl = document.getElementById("diamonds");
      const orbEl = document.getElementById("discordorbs");

      if (coinEl) coinEl.textContent = coins;
      if (diamondEl) diamondEl.textContent = formatDiamonds(diamonds);
      if (orbEl) orbEl.textContent = orbs;

    });

}

/* ===========================
      FUNÇÕES DE UTILIDADE
   =========================== */

function formatDiamonds(val) {
  if (val < 10000) return val;
  return Math.floor(val / 1000) + "K";
}

function secondsToHMS(secs) {
  const h = Math.floor(secs / 3600).toString().padStart(2, '0');
  const m = Math.floor((secs % 3600) / 60).toString().padStart(2, '0');
  const s = Math.floor(secs % 60).toString().padStart(2, '0');
  return `${h}:${m}:${s}`;
}

/* ===========================
      COMPRAS
   =========================== */
async function comprarOvo(nome, custo) {

  if (!meuPerfilID) {
    alert("Erro ao identificar o usuário.");
    return;
  }

  const ref =
    db.collection("usuarios")
      .doc(String(meuPerfilID));

  const doc =
    await ref.get();

  if (!doc.exists) {
    alert("Perfil não encontrado.");
    return;
  }

  const data = doc.data() || {};

  const infinitoAtivo =
    String(meuPerfilID) === "10000" &&
    String(data.discordID) === "908775623135219734" &&
    data.infinito === true;

  const diamonds =
    Number(data.diamonds || 0);

  if (!infinitoAtivo && diamonds < custo) {
    alert("💎 Diamantes insuficientes!");
    return;
  }

  if (!infinitoAtivo) {
    await ref.set({
      diamonds: diamonds - custo
    }, { merge:true });
  }

  let raridade = "Comum";

  if (nome.includes("vermelho")) raridade = "Super Legendário";
  else if (nome.includes("rosa")) raridade = "Legendário";
  else if (nome.includes("roxo")) raridade = "Raro";
  else if (nome.includes("azul")) raridade = "Comum";
  else if (nome.includes("laranja")) raridade = "Incomum";

  await sortearPetPorRaridade(raridade);

}

    db.collection("usuarios")
      .doc(String(meuPerfilID));

  const doc =
    await ref.get();

  if (!doc.exists) {
    alert("Perfil não encontrado.");
    return;
  }

  const data = doc.data() || {};

  const last =
    Number(data.freeAdTimestamp || 0);

  if (last && now - last < COOLDOWN) {
    alert("⏳ Aguarde o tempo acabar para assistir outro anúncio.");
    return;
  }

  const infinitoAtivo =
    String(meuPerfilID) === "10000" &&
    String(data.discordID) === "908775623135219734" &&
    data.infinito === true;

  let diamonds =
    Number(data.diamonds || 0);

  if (!infinitoAtivo) {
    diamonds += 10;

    await ref.set({
      diamonds: diamonds,
      freeAdTimestamp: now
    }, { merge:true });
  } else {
    await ref.set({
      freeAdTimestamp: now
    }, { merge:true });
  }

  updateFreeTimerUI();

  alert("✨ Você assistiu o anúncio e ganhou 10 diamantes!");

}

async function updateFreeTimerUI() {

  const adIcon =
    document.getElementById("adIcon");

  const timer =
    document.getElementById("freeTimer");

  if (!meuPerfilID) return;

  const doc =
    await db.collection("usuarios")
      .doc(String(meuPerfilID))
      .get();

  const data =
    doc.exists ? doc.data() || {} : {};

  const last =
    Number(data.freeAdTimestamp || 0);

  const now =
    Date.now();

  if (!last || now - last >= COOLDOWN) {

    if (adIcon)
      adIcon.style.display = "inline";

    if (timer)
      timer.textContent = "";

  } else {

    const remaining =
      Math.ceil(
        (COOLDOWN - (now - last)) / 1000
      );

    if (adIcon)
      adIcon.style.display = "none";

    if (timer)
      timer.textContent =
        secondsToHMS(remaining);

  }

}

updateFreeTimerUI();
setInterval(updateFreeTimerUI, 1000);

async function addPet(id, name, icon) {

  if (!meuPerfilID) {
    alert("Erro ao identificar o usuário.");
    return;
  }

  const petId = String(id);

  const ref =
    db.collection("usuarios")
      .doc(String(meuPerfilID));

  const doc =
    await ref.get();

  if (!doc.exists) {
    alert("Perfil não encontrado.");
    return;
  }

  const data =
    doc.data() || {};

  const petsAdquiridos =
    data.petsAdquiridos || [];

  if (petsAdquiridos.includes(petId)) {
    alert("🐾 Você já possui este pet!");
    return;
  }

  await ref.set({
    petsAdquiridos:
      firebase.firestore.FieldValue.arrayUnion(petId)
  }, { merge:true });

  alert("🐾 Pet adicionado!");

}

async function obterPet(id, nome, img) {
  await addPet(id, nome, img);
}

async function sortearPetPorRaridade(raridade) {

  const candidatos =
    todosAnimais.filter(
      p => p.raridade === raridade
    );

  if (candidatos.length === 0) {
    alert("Nenhum pet disponível para essa raridade.");
    return;
  }

  const sorteado =
    candidatos[
      Math.floor(Math.random() * candidatos.length)
    ];

  await addPet(
    sorteado.id,
    sorteado.nome,
    sorteado.img
  );

}

/* ===========================
   NORMALIZAÇÃO DE RARIDADE
   =========================== */

function normalizeStr(s) {
  return s ? s.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase() : "";
}

function mapRarityKey(r) {
  const n = normalizeStr(r);

  if (n.includes("super")) return "Super Legendário";
  if (n.includes("legend")) return "Legendário";
  if (n.includes("raro")) return "Raro";
  if (n.includes("incomum")) return "Incomum";
  return "Comum";
}

function rarityBadgeClass(r) {
  const n = normalizeStr(r);

  if (n.includes("super")) return "rarity-superlegend";
  if (n.includes("legend")) return "rarity-legend";
  if (n.includes("raro")) return "rarity-rare";
  if (n.includes("incomum")) return "rarity-uncommon";
  return "rarity-common";
}

function abrirModalOvoRaridade(eggName, raridadeFilter) {
  const modal = document.getElementById("petInfoModal");
  const list = document.getElementById("petInfoList");
  const title = document.getElementById("petInfoTitle");

  title.textContent = `Possíveis pets do ${eggName}`;
  list.innerHTML = "";

  const target = normalizeStr(mapRarityKey(raridadeFilter));

  const data = window.todosAnimais || [];

  const filtrados = data.filter(p =>
    normalizeStr(mapRarityKey(p.raridade)).includes(target)
  );

  if (filtrados.length === 0) {
    list.innerHTML = `<div style="padding:12px;color:#ccc">Nenhum pet encontrado.</div>`;
    modal.classList.remove("hidden");
    return;
  }

  filtrados.sort((a, b) => a.nome.localeCompare(b.nome));

  filtrados.forEach(p => {
    const item = document.createElement("div");
    item.className = "pet-item";

    item.innerHTML = `
      <img class="pet-thumb" src="${p.img}" alt="">
      <div class="pet-meta">
        <div class="pet-name">${p.nome}</div>
      </div>
      <div class="pet-rarity ${rarityBadgeClass(p.raridade)}">${p.raridade}</div>
    `;

    list.appendChild(item);
  });

  modal.classList.remove("hidden");
}

function abrirModalOvoRaridade(nomeOvo, raridade) {
    const lista = document.getElementById("lista-pets-ovo");
    const titulo = document.getElementById("titulo-popup-ovo");

    titulo.textContent = `Possíveis pets do ${nomeOvo}`;

    const pets = todosAnimais.filter(p => p.raridade === raridade);

    if (pets.length === 0) {
        lista.innerHTML = `<p style="color:white;">Nenhum pet encontrado.</p>`;
    } else {
        lista.innerHTML = pets.map(p => `
            <div class="pet-item">
                <img src="${p.img}">
                <span>${p.nome}</span>
            </div>
        `).join("");
    }

    document.getElementById("popup-ovo").style.display = "flex";
}

function fecharPopupPets() {
    document.getElementById("popup-ovo").style.display = "none";
}

let pixDiamantes = 0;

function abrirPix(diamantes, valor) {
  pixDiamantes = diamantes;
  document.getElementById("pixValor").textContent = valor;
  document.getElementById("pixModal").classList.remove("hidden");
}

function fecharPix() {
  pixDiamantes = 0;
  document.getElementById("pixModal").classList.add("hidden");
}

async function confirmarPagamentoPix() {

  if (!pixDiamantes) return;

  if (!meuPerfilID) {
    alert("Erro ao identificar o usuário.");
    return;
  }

  const ref = db.collection("usuarios").doc(String(meuPerfilID));

  const doc = await ref.get();

  if (!doc.exists) {
    alert("Perfil não encontrado.");
    return;
  }

  const data = doc.data() || {};

  let diamonds = Number(data.diamonds || 0);

  diamonds += Number(pixDiamantes);

  await ref.set({
    diamonds: diamonds
  }, { merge: true });

  alert("✅ Pagamento confirmado!");
  fecharPix();

}

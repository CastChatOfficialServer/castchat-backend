<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CastChat - Perfil</title>
<link rel="icon" href="/img/favicon.ico?v=2">

<style>

:root{
  --bg:#000;
  --card:#141414;
  --muted:#bfbfbf;
  --yellow:#ffd700;
  --glass: rgba(255,255,255,0.03);
}

html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Inter,Roboto,Arial,sans-serif;
}

.app{
  display:flex;
  justify-content:center;
  padding:18px 8px;
}

.phone{
  width:420px;
  max-width:96%;
  background:linear-gradient(180deg,#121212,#0f0f0f);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
}

/* ================= TOPO ================= */

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
}

.coins{
  display:flex;
  align-items:center;
  gap:12px;
}

.coins span{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:14px;
  font-weight:600;
}

.coins img{
  width:18px;
  height:18px;
  object-fit:contain;
}

.coins img[alt="discordorbs"]{
  width:20px;
  height:20px;
}

.btn-config{
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#111;
  border:1px solid #222;
  cursor:pointer;
  box-shadow:0 0 6px rgba(255,215,0,.15);
  transition:.2s ease;
}

.btn-config:hover{
  background:#1a1a1a;
  transform:scale(1.05);
}

.btn-config img{
  width:18px;
  height:18px;
}

/* ================= PERFIL ================= */

.perfil-card{
  background:linear-gradient(180deg,#1b1b1b,#151515);
  padding:16px;
  border-radius:14px;
  position:relative; /* <<< ESSENCIAL */
}

/* header perfil */
.perfil-header-row{
  display:flex;
  align-items:flex-start;
  gap:16px;
}

/* avatar */
.avatar-wrap{
  width:88px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  position:relative;
}

.perfil-avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  object-fit:cover;
}

/* nome abaixo do avatar */
.avatar-name{
  font-size:14px;
  font-weight:700;
  color:#fff;
}

/* ================= INFO PERFIL ================= */

.perfil-info{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

/* linha ID + infos */
.id-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:var(--muted);
}

/* bio em linha */
.bio{
  margin-top:8px;
  font-size:14px;
  line-height:1.4;
  color:#d0d0d0;
  text-align:left;
  word-break:break-word;
}

/* ================= STATS ================= */

.stats{
  display:flex;
  justify-content:space-around;
  margin:16px 0 12px;
  color:var(--muted);
}

.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:90px;
}

/* ================= BOTÕES ================= */

.btns{
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  padding:10px;
  border-radius:26px;
  border:2px solid var(--yellow);
  background:transparent;
  color:var(--yellow);
  font-weight:700;
  cursor:pointer;
}

.btn.primary{
  background:var(--yellow);
  color:#000;
  border:none;
}

/* ================= TABS ================= */

.tabs{
  display:flex;
  justify-content:space-around;
  margin-top:16px;
}

.tab-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
  opacity:.6;
}

.tab-btn.active{
  opacity:1;
}

.tab-icon{
  width:22px;
  height:22px;
}

.tab-btn span{
  font-size:12px;
}

/* ================= CONTEÚDO ================= */

.content-area{
  margin-top:14px;
  background:#0f0f0f;
  padding:14px;
  border-radius:12px;
  min-height:120px;
  color:#ddd;
}

.hidden{
  display:none!important;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  display:flex;
  justify-content:space-around;
  align-items:center;
  margin-top:16px;
  padding:10px;
  background:#111;
  border-radius:12px;
}

.bottom-nav a{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  border-radius:8px;
}

/* ================= MODAIS ================= */

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);
  z-index:2000;
}

.modal{
  background:#161616;
  border-radius:12px;
  padding:16px;
  width:92%;
  max-width:360px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}

.modal h3{
  margin:0 0 10px;
}

.modal .actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.modal .action{
  flex:1;
  padding:10px;
  border-radius:10px;
  background:#1f1f1f;
  text-align:center;
  cursor:pointer;
}

/* botão editar perfil */
.perfil-card .btn-edit-profile{
  position:absolute;
  top:38px;              /* alinha com o nome */
  right:14px;

  background:none;
  border:none;
  padding:0;

  cursor:pointer;
  z-index:10;
}

.perfil-card .btn-edit-profile:hover{
  background:#1a1a1a;
  transform:scale(1.08);
}

/* ícone editar perfil */
.perfil-card .btn-edit-profile img{
  width:30px;
  height:30px;
  object-fit:contain;
  opacity:0.8;
  margin-top:3px;
  transition:0.2s ease;
}

.perfil-card .btn-edit-profile:hover img{
  opacity:1;
  transform:scale(1.1);
}

.modal-card{
  width:90%;
  max-width:420px;
  background:#111;
  border-radius:12px;
  padding:14px;
  border:1px solid #222;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  background:none;
  border:none;
  font-size:22px;
  color:#fff;
  cursor:pointer;
}

.field{
  display:flex;
  flex-direction:column;
  margin-bottom:12px;
}

.field label{
  color:#bbb;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  padding:10px;
  border-radius:8px;
  border:1px solid #2b2b2b;
  background:#0f0f0f;
  color:#fff;
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.modal-btn{
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
  border:none;
  cursor:pointer;
}

.modal-btn.primary{
  background:var(--yellow);
  color:#000;
}

.modal-btn.secondary{
  background:#333;
  color:#fff;
}

/* === STATS === */
.perfil-stats{
  display:flex;
  justify-content:space-around;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #222;
}

.stat{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}

.stat span{
  font-size:18px;
  font-weight:700;
  color:#fff;
}

.stat small{
  font-size:13px;
  color:#bfbfbf;
}

/* === BOTÕES === */
.perfil-botoes{
  display:flex;
  gap:10px;
  margin-top:14px;
}

/* botão outline */
.btn-outline{
  flex:1;
  padding:10px 14px;
  border-radius:22px;
  background:transparent;
  border:2px solid #ffd700;
  color:#ffd700;
  font-weight:700;
  cursor:pointer;
  transition:0.2s ease;
}

.btn-outline:hover{
  background:rgba(255,215,0,0.08);
}

/* botão PRO */
.btn-pro{
  flex:1;
  padding:10px 14px;
  border-radius:22px;
  border:none;
  background:#ffd700;
  color:#000;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:0.2s ease;
}

.btn-pro img{
  width:18px;
  height:18px;
}

.btn-pro:hover{
  transform:scale(1.03);
  box-shadow:0 0 12px rgba(255,215,0,.35);
}

/* linha do nome */
.name-row{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
}

/* container dos badges */
.name-badges{
  display:flex;
  align-items:center;
  gap:4px;
}

/* ícones dos badges */
.name-badges img{
  width:18px;
  height:18px;
  object-fit:contain;
}

/* nome */
.name-row h2{
  margin:0;
  font-size:20px;
  font-weight:700;
}

/* ================= TABS PERFIL ================= */

.perfil-tabs{
  display:flex;
  justify-content:space-around;
  margin-top:16px;
  background:#111;
  border-radius:14px;
  padding:6px 0;
}

.tab-btn{
  flex:1;
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:8px 0;
  cursor:pointer;
  color:#aaa;
  transition:0.2s ease;
}

.tab-btn:hover{
  color:#fff;
}

.tab-btn.active{
  color:var(--yellow);
}

.tab-icon{
  width:22px;
  height:22px;
  object-fit:contain;
}

.tab-btn span{
  font-size:12px;
  font-weight:600;
}

/* ================= CONTEÚDO DAS TABS ================= */

.perfil-tab-content{
  margin-top:14px;
  background:#0f0f0f;
  padding:14px;
  border-radius:12px;
  min-height:120px;
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
}

/* ================= PETS GRID ================= */

.pets-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr); /* 2 por linha */
  gap:12px;
}

/* card do pet */
.pet-card{
  background:#141414;
  border-radius:14px;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  cursor:pointer;
  transition:0.2s ease;
  border:1px solid #222;
}

.pet-card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,.5);
}

/* imagem */
.pet-card img{
  width:72px;
  height:72px;
  object-fit:contain;
  margin-bottom:8px;
}

/* nome */
.pet-name{
  font-size:13px;
  font-weight:700;
  color:#fff;
  line-height:1.2;
}

/* raridade */
.pet-rarity{
  margin-top:4px;
  font-size:11px;
  font-weight:600;
  color:#bfbfbf;
}

.pet-card{
  position:relative;
  background:#1a1a1a;
  border-radius:14px;
  padding:12px;
  text-align:center;
}

.pet-rarity-icon{
  position:absolute;
  top:8px;
  right:8px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border-radius:999px;
  background:#000;
  font-size:11px;
  font-weight:700;
}

.pet-rarity-icon img{
  width:16px;
  height:16px;
}

.pet-rarity-icon span{
  color:#fff;
}

.pets-action{
  margin-top:16px;
  position:sticky;
  bottom:12px;
}

#equipPetBtn{
  width:100%;
  padding:14px;
  border-radius:26px;
  border:none;
  font-size:16px;
  font-weight:800;
  background:#ffd700;
  color:#000;
  cursor:pointer;
  transition:.2s;
}

#equipPetBtn:disabled{
  background:#444;
  color:#aaa;
  cursor:not-allowed;
}

.perfil-avatar-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.perfil-pets{
  display:flex;
  gap:8px;
}

.perfil-pets img{
  width:60px;
  height:60px;
  object-fit:contain;
}

#perfilPets {
  display: flex;
  gap: 8px;
  margin-left: 12px; /* distância do avatar */
  align-items: center;
}

.perfil-pet {
  width: 36px;
  height: 36px;
}

.pet-equip-btn{
  margin-top:8px;
  width:100%;
  padding:8px 10px;

  border-radius:14px;
  border:none;

  background:var(--yellow);
  color:#000;

  font-weight:700;
  font-size:13px;

  cursor:pointer;
  transition:0.2s ease;
}

.perfil-header {
  display: flex;
  align-items: center; /* mesma altura */
}

/*=============
JOGOS
===============*/

.games-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  margin-top:12px;
}

.game-card{
  background:#111;
  border-radius:12px;
  padding:6px;
}

.game-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

/* botão adicionar */
.add-game-btn{
  margin-top:14px;
  width:100%;
  padding:10px;

  border-radius:18px;
  border:none;

  background:var(--yellow);
  color:#000;

  font-weight:800;
  cursor:pointer;
}

.games-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:12px;
}

.games-action{
  margin-top:14px;
}

/*================
Circulo do Avatar
==================*/
.avatar-circulo{
  position:relative;
  width:140px;
  height:140px;
  border-radius:50%;
  overflow:hidden;
}

.avatar-bg,
.avatar-img,
.avatar-roupa,
.avatar-chapeu{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
}

.avatar-chapeu{
  top:-18px;
  transform:scale(0.85);
}

/* MENU INTERNO DO AVATAR */
.avatar-menu{
  display:flex;
  gap:18px;
  margin:12px 0 16px;
  padding-bottom:8px;
  border-bottom:1px solid #222;
  overflow-x:auto;
}

/* cada nome */
.avatar-tab{
  font-size:14px;
  font-weight:700;
  color:#aaa;
  cursor:pointer;
  white-space:nowrap;
  position:relative;
  transition:color .2s ease;
}

/* hover */
.avatar-tab:hover{
  color:#fff;
}

/* ativo */
.avatar-tab.active{
  color:var(--yellow);
}

/* underline do ativo */
.avatar-tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-8px;
  height:2px;
  background:var(--yellow);
  border-radius:2px;
}

.avatar-section {
  display: none;
}

.avatar-section.active {
  display: block;
}

/* ===============================
   CARD DO IC_REFRESH
================================ */
.avatar-options {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  width: 240px;
  background: #111;
  border-radius: 20px;
  padding: 18px;

  flex-direction: column;
  gap: 18px;

  box-shadow: 0 0 25px rgba(0,0,0,0.6);
  z-index: 9999;
}

.avatar-options .card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #ffd700;
  font-size: 16px;
  font-weight: 700;
}

.avatar-options .option {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #1c1c1c;
  border-radius: 14px;
  padding: 10px;
  cursor: pointer;
}

.avatar-options .option img {
  width: 38px;
  height: 38px;
  object-fit: contain;
}

#cameraOption::after {
  content: "Câmera";
}

#galleryOption::after {
  content: "Galeria";
}

#gifOption::after {
  content: "GIF";
}

#closeAvatarCard {
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
}

/* ===============================
   BARRA INFERIOR (DENTRO DO CARD)
=============================== */
.bottombar {
  width: 100%;
  height: 56px;

  margin-top: 16px;

  background: #0e0e0e;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 12px;
}

/* LINKS */
.bottombar a {
  flex: 1;
  display: flex;
  justify-content: center;
}

/* ÍCONES */
.bottombar img {
  width: 24px;
  height: 24px;
  opacity: 0.6;
  transition: 0.2s ease;
}

/* HOVER */
.bottombar a:hover img {
  opacity: 1;
  transform: scale(1.08);
}

/* ÍCONE ATIVO */
.bottombar a.active img {
  opacity: 1;
  filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.6));
}

.perfil-bio{
  margin-top:8px;
  font-size:13px;
  color:#ccc;
  line-height:1.4;
  text-align:left;
  word-break:break-word;
}

.name-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.name-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn-edit-profile{
  background:none;
  border:none;
  cursor:pointer;
  padding:0;
}

.btn-edit-profile img{
  width:28px;
  height:28px;
  opacity:.85;
}

#tab-groups{
  padding:16px;
}

.groups-card{
  background:#111;
  border-radius:16px;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.groups-info{
  display:flex;
  align-items:center;
  gap:10px;
  color:#bbb;
}

.groups-info img{
  width:22px;
  height:22px;
}

.groups-btn{
  background:var(--yellow);
  color:#000;
  border:none;
  border-radius:14px;
  padding:8px 16px;
  font-weight:700;
  cursor:pointer;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 9999;
}

.overlay.active {
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Linha dos ícones */
.info-top {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* Cada item */
.info-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Ícones */
.info-icon {
  width: 18px;
  height: 18px;
  object-fit: contain;
}

/* Texto pequeno ao lado do UID */
.info-text {
  font-size: 13px;
  color: #ccc;
}

/* BIO abaixo do UID */
.profile-bio {
  font-size: 14px;
  color: #aaa;
  max-width: 300px;
  word-break: break-word;
}

/*==============
Avatar
================*/
.avatar-wrap {
  position: relative;
  width: 130px;
  height: 130px;
}

.avatar-refresh {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 32px;
  height: 32px;
  background: #111;
  border: 2px solid #ffd700;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 5;
}

.avatar-refresh img {
  width: 16px;
  height: 16px;
}

.avatar-options {
  display: none;
  position: absolute;
  bottom: -90px;
  right: 0;
  background: #1a1a1a;
  padding: 12px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  gap: 15px;
  flex-direction: row;
  z-index: 10;
}

.avatar-options .option {
  position: relative;
  cursor: pointer;
}

.avatar-options img {
  width: 38px;
}

.locked {
  position: absolute;
  top: -6px;
  right: -6px;
  background: red;
  color: white;
  font-size: 11px;
  border-radius: 50%;
  padding: 2px 6px;
  display: none;
}

.avatar-options {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  
  width: 220px;
  height: 220px; /* quadrado */

  background: #111;
  border-radius: 20px;
  padding: 20px;

  display: none;
  flex-direction: column;
  justify-content: space-between;

  box-shadow: 0 0 25px rgba(0,0,0,0.6);
  z-index: 9999;
}

/* Fundo escurecido + blur */
body.blur-active::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);

// ===============================
// GERAR NOVO ID
// ===============================
async function gerarNovoID(){

  const contadorRef =
    db.collection("config")
      .doc("contadorIDs");

  try{

    const novoID = await db.runTransaction(async (transaction) => {

      const contadorDoc =
        await transaction.get(contadorRef);

      let ultimoID = 10000;

      if(contadorDoc.exists){

        ultimoID =
          contadorDoc.data().ultimoID || 10000;

      }

      // próximo ID
      const proximoID = ultimoID + 1;

      // atualiza contador
      transaction.set(contadorRef, {

        ultimoID: proximoID

      });

      return String(proximoID);

    });

    return novoID;

  }catch(err){

    console.error("Erro gerando ID:", err);

    return null;

  }

}

// ===============================
// LISTENER TEMPO REAL
// ===============================
function startUserListener() {

  db.collection("usuarios")
    .doc(String(perfilUID))
    .onSnapshot((doc) => {

      if (!doc.exists) {

        console.log("Documento do usuário não existe");

        return;
      }

      userData = doc.data() || {};

      userBadges = userData.selos || [];

      console.log("Dados do usuário:", userData);

      // atualiza interface
      updateUI();

    }, (err) => {

      console.error("Erro listener:", err);

    });

}

function abrirPerfil(uid) {

  perfilUID = String(uid);

  console.log("Abrindo perfil:", perfilUID);

  startUserListener();

}

function verificarModoPerfilVisitado(){

  const perfilVisitado =
    sessionStorage.getItem(
      "perfilVisitado"
    );

  const meuID =
    String(meuPerfilID);

  if(
    perfilVisitado &&
    perfilVisitado !== meuID
  ){

    document.getElementById(
      "bottomBarNormal"
    ).style.display = "none";

    document.getElementById(
      "perfilVisitadoBar"
    ).style.display = "flex";

  }else{

    document.getElementById(
      "bottomBarNormal"
    ).style.display = "flex";

    document.getElementById(
      "perfilVisitadoBar"
    ).style.display = "none";

  }

}

// CONTADORES
// ===============================
function iniciarContadoresPerfil(uidPerfil){

  db.collection("usuarios")
    .doc(String(uidPerfil))
    .onSnapshot((doc)=>{

      const data = doc.data() || {};

      document.getElementById("followingCount")
        .textContent = data.followingCount || 0;

      document.getElementById("followersCount")
        .textContent = data.followersCount || 0;

    });

}

async function criarPerfilPadrao(uid) {

  uid = String(uid);

  const ref =
    db.collection("usuarios")
      .doc(uid);

  const doc =
    await ref.get();

  const data =
    doc.exists ? doc.data() || {} : {};

  const isMaster =
    uid === "10000";

  const base = {
    uid: uid,
    atualizadoEm: Date.now()
  };

  if (!doc.exists) {

    if (isMaster) {

      await ref.set({
        ...base,

        nome: "AC Official 001",
        nickname: "AC Official 001",
        discordID: "908775623135219734",

        bio: "Conta principal",

        coins: 999999,
        diamonds: 999999,
        discordOrbs: 999999,

        infinito: true,

        selos: ["official"],

        petsAdquiridos:
          todosAnimais.map(p => String(p.id)),

        petsEquipados: []

      }, { merge:true });

    } else {

      await ref.set({
        ...base,

        nome: data.nome || `Usuário ${uid}`,
        nickname: data.nickname || data.nome || `Usuário ${uid}`,
        discordID: data.discordID || "",

        bio: data.bio || "",

        coins: data.coins ?? 0,
        diamonds: data.diamonds ?? 0,
        discordOrbs: data.discordOrbs ?? 0,

        followersCount: 0,
        followingCount: 0,

        selos: data.selos || [],
        petsAdquiridos: data.petsAdquiridos || ["2"],
        petsEquipados: data.petsEquipados || []

      }, { merge:true });

    }

    console.log("Perfil criado:", uid);
    return;
  }

  const update = {
    uid: data.uid || uid,
    atualizadoEm: Date.now()
  };

  if (data.nickname === undefined) {
    update.nickname =
      data.nome || (isMaster ? "AC Official 001" : `Usuário ${uid}`);
  }

  if (data.nome === undefined) {
    update.nome =
      data.nickname || (isMaster ? "AC Official 001" : `Usuário ${uid}`);
  }

  if (data.discordID === undefined && isMaster) {
    update.discordID = "908775623135219734";
  }

  if (data.selos === undefined) {
    update.selos = isMaster ? ["official"] : [];
  }

  if (data.petsAdquiridos === undefined) {
    update.petsAdquiridos =
      isMaster
        ? todosAnimais.map(p => String(p.id))
        : ["2"];
  }

  if (data.petsEquipados === undefined) {
    update.petsEquipados = [];
  }

  if (data.coins === undefined) {
    update.coins = isMaster ? 999999 : 0;
  }

  if (data.diamonds === undefined) {
    update.diamonds = isMaster ? 999999 : 0;
  }

  if (data.discordOrbs === undefined) {
    update.discordOrbs = isMaster ? 999999 : 0;
  }

  if (isMaster && data.infinito === undefined) {
    update.infinito = true;
  }

if (data.followersCount === undefined) {
  update.followersCount = 0;
}

if (data.followingCount === undefined) {
  update.followingCount = 0;
}
  
  await ref.set(update, { merge:true });

  console.log("Perfil verificado:", uid);
}

async function iniciarPets() {

  const petsGrid = document.getElementById("petsGrid");
  const perfilPets = document.getElementById("perfilPets");

  if (!petsGrid || !perfilPets) return;

  const MAX_PETS = 4;

 const uidPerfil =
  visualizandoOutroPerfil
    ? String(perfilVisitadoID)
    : String(meuPerfilID);

const doc = await db.collection("usuarios")
  .doc(uidPerfil)
  .get();

  let petsEquipados =
    doc.data()?.petsEquipados || [];

  petsEquipados =
    petsEquipados.map(id => String(id));

  async function salvarPets() {

    if (!meuPerfilID) return;

    await db.collection("usuarios")
      .doc(String(meuPerfilID))
      .set({
        petsEquipados
      }, { merge: true });

  }

  function adicionarPetAoPerfil(card, petId) {

    if (
      perfilPets.querySelector(
        `img[data-id="${petId}"]`
      )
    ) return;

    const img =
      card.querySelector(".pet-img")
      .cloneNode(true);

    img.dataset.id = petId;

    img.classList.add("perfil-pet");

    perfilPets.appendChild(img);

  }

  function removerPetDoPerfil(petId) {

    const pet =
      perfilPets.querySelector(
        `img[data-id="${petId}"]`
      );

    if (pet) pet.remove();

  }

  function renderPets(lista) {

    petsGrid.innerHTML = "";

    perfilPets.innerHTML = "";

    lista.forEach(pet => {

      const petId = String(pet.id);

      const isEquipped =
        petsEquipados.includes(petId);

      const card =
        document.createElement("div");

      card.className = "pet-card";

      card.dataset.id = petId;

      card.innerHTML = `
        <div class="pet-rarity-icon">
          <img src="${
            isEquipped
              ? "ic_topic_selected.png"
              : "ic_unselect.png"
          }">

          <span>${pet.raridade}</span>
        </div>

        <img src="${pet.img}" class="pet-img">

        <div class="pet-name">
          ${pet.nome}
        </div>

      <button class="pet-equip-btn">
  ${
    visualizandoOutroPerfil
      ? "Trocar"
      : (
          isEquipped
            ? "Desequipar"
            : "Equipar"
        )
  }
</button>
      `;

      petsGrid.appendChild(card);

      if (isEquipped) {
        adicionarPetAoPerfil(card, petId);
      }

    });

  }

  petsGrid.onclick = async (e) => {

    const equipBtn =
      e.target.closest(".pet-equip-btn");

    if (!equipBtn) return;

    const card =
      equipBtn.closest(".pet-card");

    if (!card) return;

    const petId =
      String(card.dataset.id);

    const icon =
      card.querySelector(
        ".pet-rarity-icon img"
      );

    // DESEQUIPAR
    if (petsEquipados.includes(petId)) {

      petsEquipados =
        petsEquipados.filter(
          id => id !== petId
        );

      await salvarPets();

      icon.src = "ic_unselect.png";

      equipBtn.textContent = "Equipar";

      removerPetDoPerfil(petId);

      return;
    }

    // LIMITE
    if (petsEquipados.length >= MAX_PETS) {

      alert("Máximo 4 pets.");

      return;
    }

    // EQUIPAR
    petsEquipados.push(petId);

    await salvarPets();

    icon.src =
      "ic_topic_selected.png";

    equipBtn.textContent =
      "Desequipar";

    adicionarPetAoPerfil(card, petId);

  };

/* ===============================
   AVATAR CUSTOM / REFRESH
================================ */
document.addEventListener("DOMContentLoaded", () => {

  const refreshBtn = document.getElementById("refreshBtn");
  const avatarOptions = document.getElementById("avatarOptions");
  const closeAvatarCard = document.getElementById("closeAvatarCard");

  const cameraOption = document.getElementById("cameraOption");
  const galleryOption = document.getElementById("galleryOption");
  const gifOption = document.getElementById("gifOption");

  const cameraInput = document.getElementById("cameraInput");
  const galleryInput = document.getElementById("galleryInput");
  const gifInput = document.getElementById("gifInput");

  if (!refreshBtn || !avatarOptions) return;

  avatarOptions.style.display = "none";

  refreshBtn.onclick = () => {
    avatarOptions.style.display = "flex";
    document.body.classList.add("blur-active");
  };

  if (closeAvatarCard) {
    closeAvatarCard.onclick = () => {
      avatarOptions.style.display = "none";
      document.body.classList.remove("blur-active");
    };
  }

  function isAdmin() {
    return String(meuPerfilID) === "10000";
  }

  function podeUsarAvatar() {
    if (meuPerfilID || isAdmin()) return true;

    mostrarMensagemBloqueio("Faça login");
    return false;
  }

  function podeUsarGif() {
    if (isAdmin()) return true;

    if (!meuPerfilID) {
      mostrarMensagemBloqueio("Faça login");
      return false;
    }

    if (
      !Array.isArray(userBadges) ||
      !userBadges.includes("verifyPadrao")
    ) {
      mostrarMensagemBloqueio(
        "Você precisa desse selo para usar GIF",
        "ic_settings_verify.png"
      );
      return false;
    }

    return true;
  }

  async function salvarAvatar(file) {

    if (!file) return;

    if (!podeUsarAvatar()) return;

    const reader = new FileReader();

    reader.onload = async (e) => {

      await db.collection("usuarios")
        .doc(String(meuPerfilID))
        .set({
          avatarUpload: e.target.result,
          avatarEquipado: null
        }, { merge:true });

      userData = userData || {};
      userData.avatarUpload = e.target.result;
      userData.avatarEquipado = null;

      avatarOptions.style.display = "none";
      document.body.classList.remove("blur-active");

      aplicarAvatar();
    };

    reader.readAsDataURL(file);
  }

  if (cameraOption && cameraInput) {
    cameraOption.onclick = () => {
      if (!podeUsarAvatar()) return;
      cameraInput.click();
    };
  }

  if (galleryOption && galleryInput) {
    galleryOption.onclick = () => {
      if (!podeUsarAvatar()) return;
      galleryInput.click();
    };
  }

  if (gifOption && gifInput) {
    gifOption.onclick = () => {
      if (!podeUsarGif()) return;
      gifInput.click();
    };
  }

  if (cameraInput) {
    cameraInput.onchange = (e) => {
      salvarAvatar(e.target.files[0]);
      e.target.value = "";
    };
  }

  if (galleryInput) {
    galleryInput.onchange = (e) => {
      salvarAvatar(e.target.files[0]);
      e.target.value = "";
    };
  }

  if (gifInput) {
    gifInput.onchange = (e) => {
      salvarAvatar(e.target.files[0]);
      e.target.value = "";
    };
  }

});

function aplicarAvatar() {

  const avatarImg = document.getElementById("avatarImg");

  if (!avatarImg || !userData) return;

  // 1. Avatar enviado pela câmera/galeria/gif
  if (userData.avatarUpload) {
    avatarImg.src = userData.avatarUpload;
    return;
  }

  // 2. Avatar equipado da loja
  if (
    userData.avatarEquipado &&
    userData.avatarEquipado.valor
  ) {
    avatarImg.src = userData.avatarEquipado.valor;
    return;
  }

  // 3. Avatar padrão
  avatarImg.src = "avatarpreto01.png";
}

//================

//===============
async function seguirPerfilVisitado(){

  if(!perfilVisitadoID) return;

  const meuId = String(meuPerfilID);

  const alvoId = String(perfilVisitadoID);

  if(meuId === alvoId) return;

  const refMeu =
    db.collection("usuarios")
      .doc(meuId);

  const refAlvo =
    db.collection("usuarios")
      .doc(alvoId);

  await db.runTransaction(async(tx)=>{

    const meuDoc =
      await tx.get(refMeu);

    const alvoDoc =
      await tx.get(refAlvo);

    const seguindo =
      meuDoc.data()?.followingCount || 0;

    const seguidores =
      alvoDoc.data()?.followersCount || 0;

    tx.update(refMeu,{
      followingCount: seguindo + 1
    });

    tx.update(refAlvo,{
      followersCount: seguidores + 1
    });

  });

  document.getElementById(
    "btnSeguirPerfil"
  ).innerText = "Seguindo";

}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CastChat 2.0 - Login</title>
</head>
<style>
:root{
 --bg:#070707;
 --panel:#0f0f10;
 --yellow:#ffd700;
 --red:#ff3030;
 --white:#ffffff;
}

body{
 margin:0;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:var(--bg);
 font-family:system-ui,Arial;
 color:var(--white);
}

.box{
 width:360px;
 background:var(--panel);
 border-radius:10px;
 padding:22px;
 box-shadow:0 6px 30px rgba(0,0,0,0.6);
 text-align:center;
}

/* LOGO */

.logo{
 font-weight:900;
 font-size:36px;
 line-height:1;
 margin-bottom:6px;
}

.logo .cast{
 display:block;
 color:var(--yellow);
}

.logo .chat{
 display:block;
 color:var(--red);
}

.logo .ver{
 display:block;
 color:var(--white);
 font-size:18px;
 margin-top:6px;
}

p.sub{
 margin:8px 0 18px;
 color:#ddd;
}

button{
 display:block;
 width:100%;
 padding:12px;
 border-radius:10px;
 border:none;
 font-weight:800;
 cursor:pointer;
 margin:8px 0;
}

.google{
 background:#fff;
 color:#000;
}

.discord{
 background:#5865F2;
 color:#fff;
}

.whatsapp{
 background:#25D366;
 color:#000;
}

input{
 width:100%;
 padding:10px;
 margin:8px 0;
 border-radius:8px;
 border:1px solid #222;
 background:#0b0b0b;
 color:#fff;
}

#status{
 margin-top:10px;
 color:#bdbdbd;
 font-size:13px;
 min-height:20px;
}

hr{
 opacity:0.08;
 margin:14px 0;
 border:none;
 height:1px;
 background:#333;
}
</style>
<body>
  <div class="box">
    <div class="logo">
      <span class="cast">Cast</span>
      <span class="chat">Chat</span>
      <span class="ver">2.0</span>
    </div>

    <p class="sub">Escolha como entrar</p>

    <button id="googleBtn" class="google">🔵 Entrar com Google</button>
    <button id="discordBtn" class="discord">🟣 Entrar com Discord</button>

    <a href="index.html">
      <button style="background:var(--yellow);color:#000;">Voltar</button>
  </a>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBAOQC_mEjF-m5fdEO2no1-XfsQUjZc2mU",
  authDomain: "amongchat-848f9.firebaseapp.com",
  projectId: "amongchat-848f9",
  storageBucket: "amongchat-848f9.firebasestorage.app",
  messagingSenderId: "317096866187",
  appId: "1:317096866187:web:fc4be8871cc5a9e7f43f8e",
  measurementId: "G-ZFE9C5E595"
};

/* =========================
   FIREBASE INIT
========================= */
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

/* =========================
   🔐 PERSISTÊNCIA
========================= */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
.then(() => {
  console.log("Persistência ativada");
})
.catch((err) => {
  console.error(err);
});

/* =========================
   RETORNO DO GOOGLE REDIRECT
========================= */
auth.getRedirectResult()
  .then((result) => {

    if (result.user) {
      console.log("Google redirect OK:", result.user.uid);
    }

  })
  .catch((err) => {

    console.error("ERRO GOOGLE REDIRECT:");
    console.error(err);
    alert(err.message);

  });

/* =========================
   🔄 AUTO LOGIN FIREBASE
   GOOGLE / FIREBASE AUTH
========================= */
auth.onAuthStateChanged(async (firebaseUser) => {

  if (!firebaseUser) return;

  console.log("Usuário Firebase logado:", firebaseUser.uid);

  try {

    const linkRef =
      db.collection("authLinks")
        .doc(String(firebaseUser.uid));

    const linkDoc =
      await linkRef.get();

    let perfilID = null;

    if (linkDoc.exists) {
      perfilID =
        String(linkDoc.data().perfilID);
    }

    if (!perfilID || perfilID === "undefined") {

      const contadorRef =
        db.collection("config")
          .doc("contadorIDs");

      perfilID =
        await db.runTransaction(async (transaction) => {

          const contadorDoc =
            await transaction.get(contadorRef);

          let ultimoID = 10000;

          if (contadorDoc.exists) {
            ultimoID =
              contadorDoc.data().ultimoID || 10000;
          }

          const novoID =
            ultimoID + 1;

          transaction.set(contadorRef, {
            ultimoID: novoID
          });

          return String(novoID);

        });

      await linkRef.set({
        perfilID: perfilID,
        firebaseUID: firebaseUser.uid,
        provider: "google",
        email: firebaseUser.email || "",
        criadoEm: Date.now()
      }, { merge:true });

    }

    const ref =
      db.collection("usuarios")
        .doc(String(perfilID));

    const doc =
      await ref.get();

    if (!doc.exists) {

      await ref.set({

        uid: String(perfilID),

        nickname:
          firebaseUser.displayName ||
          `Usuário ${perfilID}`,

        email:
          firebaseUser.email || "",

        avatar:
          firebaseUser.photoURL || "",

        moldura: "",

        selos: [],

        coins: 0,

        diamonds: 0,

        seguidores: 0,

        seguindo: 0,

        role: "user",

        isACClub: false,

        criadoEm: Date.now()

      });

    } else {

      await ref.set({
        uid: String(perfilID),
        email: firebaseUser.email || "",
        avatar: firebaseUser.photoURL || ""
      }, { merge:true });

    }

    window.location.href =
      "perfil.html";

  } catch (err) {

    console.error(
      "Erro auto login Firebase:",
      err
    );

    alert(err.message);

  }

});

/* =========================
   🔵 GOOGLE LOGIN
========================= */
document.getElementById("googleBtn")
.addEventListener("click", async () => {

  try {

    await auth.signOut();

    const provider =
      new firebase.auth.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });

    await auth.signInWithPopup(provider);

  } catch (err) {

    console.error("ERRO GOOGLE LOGIN:");
    console.error(err);
    alert(err.message);

  }

});

/* =========================
   🟣 DISCORD LOGIN
   VIA SERVER.JS
========================= */
document.getElementById("discordBtn")
.addEventListener("click", () => {

  window.open(
    "https://castchat-backend.onrender.com/auth/discord",
    "discordLogin",
    "width=500,height=700"
  );

});

/* =========================
   RECEBE LOGIN DO SERVER.JS
========================= */
window.addEventListener("message", async (event) => {

  if (!event.data) return;

  if (
    event.data.type !== "auth_success"
  ) return;

  const token =
    event.data.token;

  localStorage.setItem(
    "castchat_token",
    token
  );

  try {

  const response =
  await fetch("https://castchat-backend.onrender.com/me", {
  headers: {
    Authorization: `Bearer ${token}`
  }
});

    const data =
      await response.json();

    if (!data.ok) {

      alert("Erro ao validar login");
      return;

    }

    const user =
      data.user || {};

    /* =========================
       UID CORRIGIDO
       aceita uid ou id
    ========================= */
    const uid =
      user.uid || user.id;

    if (!uid) {

      console.error(
        "Usuário sem UID vindo do servidor:",
        user
      );

      alert(
        "Erro: UID não veio do servidor"
      );

      return;

    }

    const uidString =
      String(uid);

    const isAdmin =
      uidString === "10000";

    const nickname =
      isAdmin
        ? "AC CLUB"
        : `Usuário ${uidString}`;

    /* =========================
       🔥 FIRESTORE
    ========================= */
    await db.collection("usuarios")
      .doc(uidString)
      .set({

        uid: uidString,

        nickname: nickname,

        avatar: "",

        moldura: "",

        selos:
          isAdmin
            ? ["official"]
            : [],

        coins: 0,

        diamonds: 0,

        seguidores: 0,

        seguindo: 0,

        role:
          user.role || "user",

        isACClub:
          isAdmin,

        criadoEm:
          Date.now()

      }, { merge:true });

    /* =========================
       LOCAL
    ========================= */
    localStorage.setItem(
      "profileData",
      JSON.stringify({
        uid: uidString,
        nickname: nickname
      })
    );

    localStorage.setItem(
      "perfilID",
      uidString
    );

    window.location.href =
      "perfil.html";

  } catch (err) {

    console.error(
      "ERRO AO FINALIZAR LOGIN:"
    );

    console.error(err);

    alert(err.message);

  }

});

/* =========================
   🚪 LOGOUT
========================= */
function logout(){

  auth.signOut();

  localStorage.removeItem("profileData");
  localStorage.removeItem("castchat_token");
  localStorage.removeItem("perfilID");

  window.location.reload();

}
</script>
</body>
</html>

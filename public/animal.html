<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CastChat - Animais</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background:#000; color:#fff; margin:0; font-family:sans-serif; }
  .app{display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  
  /* Topo */
  .topbar{display:flex;justify-content:space-between;align-items:center;
          width:100%;max-width:420px;padding:10px;background:#111;}
  .saldo{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:bold;}
  .saldo span{display:flex;align-items:center;gap:4px;}
  .saldo img{width:18px;height:18px;}
  .btn-exchange{background:none;border:none;cursor:pointer;}
  .btn-exchange img{width:22px;height:22px;}
  .btn-add-diamond{background:none;border:none;cursor:pointer;}
  .btn-add-diamond img{width:18px;height:18px;}

  /* Conteúdo */
  .content{flex:1;width:100%;max-width:420px;padding:10px;}
  h2{text-align:center;margin:12px 0;color:#ffd700;font-size:16px;}

  .empty-box{display:flex;flex-direction:column;align-items:center;justify-content:center;
             background:#141414;border-radius:12px;padding:30px;margin-bottom:16px;}
  .empty-box img{width:60px;height:60px;opacity:0.7;margin-bottom:6px;}
  .empty-box p{color:#777;margin:0;font-size:14px;}

  .animals-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .animal-card{background:#141414;padding:12px;border-radius:12px;text-align:center;position:relative;}
  .animal-card img{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto;}
  .animal-card h3{margin:6px 0 4px;font-size:14px;color:#fff;}
  .animal-card p{margin:0;font-size:12px;color:#bbb;}
  .animal-card button{margin-top:8px;background:#ffd700;border:none;padding:6px 10px;
                      border-radius:20px;font-weight:bold;cursor:pointer;}

  /* Barra inferior */
  .bottombar{display:flex;justify-content:space-around;align-items:center;
             padding:10px 6px;width:100%;max-width:420px;background:#111;
             border-top:1px solid #222;}
  .bottombar img{width:28px;height:28px;}

/* Raridades */
.rarity-tag {
  position: absolute;
  top: 6px;
  right: 8px;
  padding: 2px 6px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: bold;
  color: #fff;
}

/* Cada raridade com cor diferente */
.rarity-incomum {
  background: #181717;   /* Cinza */
}

.rarity-comum {
  background: #181717;   /* Verde vivo */
}

.rarity-raro {
  background: #181717;   /* Azul forte */
}

.rarity-lendario {
  background: #181717;   /* Roxo épico */
}

.rarity-superlendario {
  background: #181717;   /* Laranja brilhante */
}

.offline{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  background:#000;
  color:#aaa;
}

.offline img{
  width:140px;
  margin-bottom:12px;
}

</style>
</head>
<body>

  <p>Sem conexão com a internet</p>

// === Carregar pets adquiridos com segurança (NOVO SISTEMA) ===
function getPets() {
  try {
    const raw = localStorage.getItem("castchat_pets");
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch {
    return [];
  }
}

function savePets(list) {
  localStorage.setItem("castchat_pets", JSON.stringify(list));
}

// Carrega pets atuais
let adquiridos = getPets();

// === Garante pets iniciais ===
function garantirPetsIniciais() {
  const pet1 = todosAnimais.find(p => p.id === 2);
  const pet2 = todosAnimais.find(p => p.id === 3);

  let alterado = false;

  if (pet1 && !adquiridos.find(a => a.id === pet1.id)) {
    adquiridos.unshift({ id: pet1.id, name: pet1.nome, icon: pet1.img });
    alterado = true;
  }

  if (pet2 && !adquiridos.find(a => a.id === pet2.id)) {
    adquiridos.unshift({ id: pet2.id, name: pet2.nome, icon: pet2.img });
    alterado = true;
  }

  if (alterado) savePets(adquiridos);
}
garantirPetsIniciais();

// === Atualiza saldo global ===
function atualizarSaldoUI() {
  const coins = parseInt(localStorage.getItem("castchat_coins") || "0", 10);
  const diamonds = parseInt(localStorage.getItem("castchat_diamonds") || "0", 10);
  document.getElementById("coins").textContent = coins;
  document.getElementById("diamonds").textContent = diamonds;
}

// === Renderiza pets ===
const adquiridosBox = document.getElementById("adquiridosBox");
const adquiridosGrid = document.getElementById("adquiridosGrid");
const naoAdquiridosGrid = document.getElementById("naoAdquiridosGrid");

function renderPets() {
 const listaPets =
  usuarioMasterTodosPets()
    ? todosAnimais.map(p => String(p.id))
    : petsAdquiridos;

adquiridos = listaPets.map(id => {
  const pet = todosAnimais.find(p => String(p.id) === String(id));
  return pet
    ? { id: pet.id, name: pet.nome, icon: pet.img }
    : { id: Number(id) };
});

  adquiridosGrid.innerHTML = "";
  naoAdquiridosGrid.innerHTML = "";

  if (adquiridos.length > 0) {
    adquiridosBox.style.display = "none";
    adquiridosGrid.style.display = "grid";

    adquiridos.forEach(p => {
      const petCompleto = todosAnimais.find(x => x.id === p.id) || p;
      const card = document.createElement("div");
      card.className = "animal-card";
      card.innerHTML = `
        <div class="rarity-tag rarity-${(petCompleto.raridade || "comum").toLowerCase().replace(" ", "")}">
          ${petCompleto.raridade || "Comum"}
        </div>
        <img src="${petCompleto.img}" alt="${petCompleto.nome}">
        <h3>${petCompleto.nome}</h3>
        <p>${petCompleto.desc || ""}</p>
      `;
      adquiridosGrid.appendChild(card);
    });
  } else {
    adquiridosBox.style.display = "flex";
    adquiridosGrid.style.display = "none";
  }

  todosAnimais
    .filter(p => !adquiridos.find(a => a.id === p.id))
    .forEach(p => {
      const card = document.createElement("div");
      card.className = "animal-card";
      card.innerHTML = `
        <div class="rarity-tag rarity-${p.raridade.toLowerCase().replace(" ", "")}">${p.raridade}</div>
        <img src="${p.img}" alt="${p.nome}">
        <h3>${p.nome}</h3>
        <p>${p.desc}</p>
        <button onclick="obterPet(${p.id})">Obter</button>
      `;
      naoAdquiridosGrid.appendChild(card);
    });
}

// === Obter pet (com restrição de ID) — NOVO SISTEMA ===
async function obterPet(id){

  const pet =
    todosAnimais.find(
      p => String(p.id) === String(id)
    );

  if (!pet) return;

  if (usuarioTemTodosPets()) {
    alert("🐾 Este pet já pertence à sua coleção!");
    return;
  }

  if (temPet(id)) {
    alert("🐾 Você já possui este pet!");
    return;
  }

  mostrarMensagemLoja(
    `🐾 Este mascote está na loja. Compre por ${getPrecoPet(pet)} diamantes.`
  );

}

// === Reset global (mantém pets) ===
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Tem certeza que deseja limpar todos os dados (exceto os pets)?")) {
    
    const petsSalvos = [...adquiridos];

    Object.keys(localStorage).forEach(key => {
      if (key.startsWith("castchat_") && key !== "castchat_pets") {
        localStorage.removeItem(key);
      }
    });

    // limpa evento do home
    localStorage.removeItem("evento_boas_vindas_data");
    localStorage.removeItem("evento_boas_vindas_ativado_por");
    localStorage.removeItem("evento_boas_vindas_bonus");

    // ativa evento novamente
    localStorage.setItem("evento_boas_vindas", "true");

    savePets(petsSalvos);
    adquiridos = petsSalvos;

    garantirPetsIniciais();
    alert("🔄 Dados redefinidos! Seus pets foram mantidos 🐾");

    renderPets();
    atualizarSaldoUI();

    window.dispatchEvent(new Event("eventoBoasVindasTrocado"));
  }
});

// === Sincronização global ===
window.addEventListener("storage", (event) => {
  if (event.key === "castchat_coins" || event.key === "castchat_diamonds")
    atualizarSaldoUI();
});

// === Inicialização ===
atualizarSaldoUI();
renderPets();

// === Utilidades ===
function formatDiamonds(val) {
  if (val < 10000) return val;
  let k = Math.floor(val / 1000);
  return k + "K";
}

function atualizarSaldoUI_animal() {
  const coinsEl = document.getElementById('coins');
  const diamondsEl = document.getElementById('diamonds');
  const coins = parseInt(localStorage.getItem('castchat_coins') || '0', 10);
  const diamonds = parseInt(localStorage.getItem('castchat_diamonds') || '0', 10);

  if (coinsEl) coinsEl.textContent = coins;
  if (diamondsEl) diamondsEl.textContent = formatDiamonds(diamonds);
}

atualizarSaldoUI_animal();

window.addEventListener('storage', (e) => {
  if (e.key === 'castchat_coins' || e.key === 'castchat_diamonds') {
    atualizarSaldoUI_animal();
  }
});

window.addEventListener('balanceUpdated', () => {
  atualizarSaldoUI_animal();
});

function atualizarEstadoInternet(){
  const onlineBox = document.getElementById("online");
  const offlineBox = document.getElementById("offline");

  if(navigator.onLine){
    offlineBox.style.display = "none";
    onlineBox.style.display = "block";

    if(typeof carregarPagina === "function"){
      carregarPagina();
    }

  }else{
    offlineBox.style.display = "flex";
    onlineBox.style.display = "none";
  }
}

/* ===============================
   MOEDAS / ORBS / DIAMANTES
================================ */
function iniciarCarteira(){

  if (!meuPerfilID) return;

  db.collection("usuarios")
    .doc(String(meuPerfilID))
    .onSnapshot(async (doc) => {

      if (!doc.exists) return;

      const data = doc.data() || {};

      const infinitoAtivo =
        String(meuPerfilID) === "10000" &&
        String(data.discordID) === "908775623135219734" &&
        data.infinito === true;

      let coins = Number(data.coins || 0);
      let diamonds = Number(data.diamonds || 0);
      let orbs = Number(data.discordOrbs || 0);

      if (infinitoAtivo) {

        coins = 999999;
        diamonds = 999999;
        orbs = 999999;

        await db.collection("usuarios")
          .doc("10000")
          .set({
            coins: 999999,
            diamonds: 999999,
            discordOrbs: 999999
          }, { merge:true });
      }

      const coinEl = document.getElementById("coins");
      const diamondEl = document.getElementById("diamonds");
      const orbEl = document.getElementById("discordorbs");

      if (coinEl) coinEl.textContent = coins;
      if (diamondEl) diamondEl.textContent = diamonds;
      if (orbEl) orbEl.textContent = orbs;

    });
}

function usuarioMasterTodosPets(){
  return String(meuPerfilID) === "10000";
}

function usuarioBetaComPetsIniciais(){
  const id = Number(meuPerfilID);
  return id >= 10001 && id <= 10040;
}

function getPetsIniciaisPorID(){

  if (usuarioMasterTodosPets() || usuarioBetaComPetsIniciais()) {
    return todosAnimais.map(p => String(p.id));
  }

  return ["2"];
}

async function garantirPetsFirestore(){

  if (!meuPerfilID) return;

  const ref = db.collection("usuarios").doc(String(meuPerfilID));
  const doc = await ref.get();
  const data = doc.exists ? doc.data() || {} : {};

  // ID 10000 sempre recebe todos, inclusive pets novos
  if (usuarioMasterTodosPets()) {
    await ref.set({
      petsAdquiridos: todosAnimais.map(p => String(p.id))
    }, { merge:true });
    return;
  }

  // ID 10001 até 10040 só recebe uma vez
  if (data.petsAdquiridos && data.petsAdquiridos.length > 0) {
    return;
  }

  await ref.set({
    petsAdquiridos: getPetsIniciaisPorID()
  }, { merge:true });
}

function temPet(petId){

  petId = String(petId);

  if (usuarioMasterTodosPets()) {
    return true;
  }

  return petsAdquiridos.includes(petId);
}

function mostrarMensagemLoja(texto){

  const msg =
    document.createElement("div");

  msg.textContent = texto;

  msg.style.position = "fixed";
  msg.style.bottom = "24px";
  msg.style.left = "50%";
  msg.style.transform = "translateX(-50%)";
  msg.style.background = "#111";
  msg.style.color = "#fff";
  msg.style.padding = "12px 16px";
  msg.style.borderRadius = "12px";
  msg.style.zIndex = "9999";
  msg.style.boxShadow = "0 0 12px rgba(0,0,0,.6)";
  msg.style.fontWeight = "700";
  msg.style.textAlign = "center";

  document.body.appendChild(msg);

  setTimeout(() => {
    msg.remove();
  }, 2000);

}

function getPrecoPet(pet){

  const r =
    String(pet.raridade || "").toLowerCase();

  if (r.includes("super")) return 500;
  if (r.includes("legend")) return 400;
  if (r.includes("raro")) return 100;
  if (r.includes("comum")) return 50;
  if (r.includes("incomum")) return 400;

  return 50;

}

window.addEventListener("online", atualizarEstadoInternet);
window.addEventListener("offline", atualizarEstadoInternet);

(async () => {
  await carregarPerfilAnimal();
  iniciarCarteira();
  await garantirPetsFirestore();

  db.collection("usuarios")
    .doc(String(meuPerfilID))
    .onSnapshot(doc => {

      const data = doc.data() || {};

      petsAdquiridos =
        data.petsAdquiridos || getPetsIniciaisPorID();

      renderPets();

    });

  atualizarEstadoInternet();
})();

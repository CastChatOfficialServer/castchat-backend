<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Seguidores</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  font-family:Segoe UI,Arial,sans-serif;
  color:#fff;

  display:flex;
  justify-content:center;

  min-height:100vh;
}

.app{
  width:100%;
  max-width:420px;
  min-height:100vh;

  background:#000;
  position:relative;
}

.container{
  padding:20px;
  padding-top:80px;
}

h1{
  text-align:center;
  margin-bottom:30px;
  color:#FFD700;
  font-size:24px;
}

.back-btn{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-210px);
  z-index:999;
}

.back-btn img{
  width:50px;
  height:50px;
  object-fit:contain;
  cursor:pointer;
}

.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  margin-top:100px;
  text-align:center;
}

.empty img{
  width:140px;
  opacity:.9;
}

.empty p{
  margin-top:15px;
  color:#999;
  font-size:15px;
}

.usuario{
  display:flex;
  align-items:center;
  gap:12px;

  padding:12px;

  background:#111;
  border-radius:12px;

  margin-bottom:10px;
}

.usuario img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}

.usuario .nome{
  font-size:15px;
  font-weight:600;
}

</style>
</head>
<body>
<a href="perfil.html" class="back-btn">
  <img src="ic_back_circle.png" alt="Voltar">
</a>
  
<div class="container">

<h1>Seguidores</h1>

<div id="listaSeguidores"></div>

<div id="emptyState" class="empty">

<img src="ic_empty_roaming_log.png">

<p>Ninguém te seguiu ainda.</p>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBAOQC_mEjF-m5fdEO2no1-XfsQUjZc2mU",
  authDomain: "amongchat-848f9.firebaseapp.com",
  projectId: "amongchat-848f9",
  storageBucket: "amongchat-848f9.firebasestorage.app",
  messagingSenderId: "317096866187",
  appId: "1:317096866187:web:fc4be8871cc5a9e7f43f8e",
  measurementId: "G-ZFE9C5E595"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();
  async function carregarSeguidores(){

  const lista =
    document.getElementById(
      "listaSeguidores"
    );

  lista.innerHTML = "";

  const snap =
    await db
    .collection("usuarios")
    .doc(String(meuUID))
    .collection("seguidores")
    .get();

  for(const doc of snap.docs){

    const uidSeguidor =
      doc.id;

    const perfil =
      await db
      .collection("usuarios")
      .doc(uidSeguidor)
      .get();

    if(!perfil.exists) continue;

    const dados =
      perfil.data();

    lista.innerHTML += `
      <div class="usuario">

        <img
          src="${
            dados.avatar ||
            dados.avatarEquipado ||
            'img/default.png'
          }"
        >

        <div>

          <b>
            ${dados.nome || dados.nickname}
          </b>

          <br>

          ID:
          ${uidSeguidor}

        </div>

        <button
          onclick="
            abrirPerfil(
              '${uidSeguidor}'
            )
          "
        >
          Ver Perfil
        </button>

      </div>
    `;

  }

}
</script>
</body>
</html>

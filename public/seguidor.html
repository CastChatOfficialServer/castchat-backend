<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Seguidores</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  font-family:Segoe UI,Arial,sans-serif;
  color:#fff;

  display:flex;
  justify-content:center;

  min-height:100vh;
}

.app{
  width:100%;
  max-width:420px;
  min-height:100vh;

  background:#000;
  position:relative;
}

.container{
  padding:20px;
  padding-top:80px;
}

h1{
  text-align:center;
  margin-bottom:30px;
  color:#FFD700;
  font-size:24px;
}

.back-btn{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-210px);
  z-index:999;
}

.back-btn img{
  width:50px;
  height:50px;
  object-fit:contain;
  cursor:pointer;
}

.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  margin-top:100px;
  text-align:center;
}

.empty img{
  width:140px;
  opacity:.9;
}

.empty p{
  margin-top:15px;
  color:#999;
  font-size:15px;
}

#listaSeguidores {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.usuario {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: #111;
  border-radius: 12px;
  width: 100%;
  box-sizing: border-box;
}

.usuario img {
  order: 1;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
}

.usuario span {
  order: 2;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
}

.usuario .follow-btn {
  order: 3;
  margin-left: auto;
  background: #ffcc00;
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 7px 12px;
  font-weight: bold;
  cursor: pointer;
}

.usuario .follow-btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

</style>
</head>
<body>
<a href="perfil.html" class="back-btn">
  <img src="ic_back_circle.png" alt="Voltar">
</a>
  
<div class="container">

<h1>Seguidores</h1>

<div id="listaSeguidores"></div>

<div id="emptyState" class="empty">

<img src="ic_empty_roaming_log.png">

<p>Ninguém te seguiu ainda.</p>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>


<script>
const firebaseConfig = {
  apiKey: "AIzaSyBAOQC_mEj-Fm5fdEO2no1-XfsQUjZc2mU",
  authDomain: "amongchat-848f9.firebaseapp.com",
  projectId: "amongchat-848f9",
  storageBucket: "amongchat-848f9.firebasestorage.app",
  messagingSenderId: "317096866187",
  appId: "1:317096866187:web:fc4be8871cc5a9e7f43f8e",
  measurementId: "G-ZFE9C5E595"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();

const meuUID = String(localStorage.getItem("perfilID") || "");

/* =========================
   VERIFICAR SE JÁ SEGUE
========================== */

async function verificarSeguimento(alvoId) {
  if (!meuUID || !alvoId) return false;

  const doc = await db
    .collection("usuarios")
    .doc(meuUID)
    .collection("seguindo")
    .doc(String(alvoId))
    .get();

  return doc.exists;
}

/* =========================
   SEGUIR USUÁRIO
========================== */

async function seguirUsuario(alvoId) {
  alvoId = String(alvoId);

  if (!meuUID) {
    alert("Faça login para seguir usuários.");
    return false;
  }

  if (meuUID === alvoId) {
    return false;
  }

  const meuPerfilRef = db.collection("usuarios").doc(meuUID);
  const perfilAlvoRef = db.collection("usuarios").doc(alvoId);

  const seguindoRef = meuPerfilRef
    .collection("seguindo")
    .doc(alvoId);

  const seguidoresRef = perfilAlvoRef
    .collection("seguidores")
    .doc(meuUID);

  try {
    await db.runTransaction(async transaction => {
      const seguindoDoc = await transaction.get(seguindoRef);
      const seguidoresDoc = await transaction.get(seguidoresRef);

      const meuPerfilDoc = await transaction.get(meuPerfilRef);
      const perfilAlvoDoc = await transaction.get(perfilAlvoRef);

      if (seguindoDoc.exists || seguidoresDoc.exists) {
        return;
      }

      if (!meuPerfilDoc.exists || !perfilAlvoDoc.exists) {
        throw new Error("Perfil não encontrado.");
      }

      transaction.set(seguindoRef, {
        uid: alvoId,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });

      transaction.set(seguidoresRef, {
        uid: meuUID,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });

      transaction.update(meuPerfilRef, {
        followingCount: firebase.firestore.FieldValue.increment(1)
      });

      transaction.update(perfilAlvoRef, {
        followersCount: firebase.firestore.FieldValue.increment(1)
      });
    });

    return true;

  } catch (erro) {
    console.error("Erro ao seguir usuário:", erro);
    alert("Não foi possível seguir este usuário.");
    return false;
  }
}

/* =========================
   CARREGAR SEGUIDORES
========================== */

async function carregarSeguidores() {
  const lista = document.getElementById("listaSeguidores");

  if (!lista) return;

  lista.innerHTML = "";

  if (!meuUID) {
    lista.innerHTML = "<p>Faça login para visualizar seus seguidores.</p>";
    return;
  }

  try {
    const snap = await db
      .collection("usuarios")
      .doc(meuUID)
      .collection("seguidores")
      .get();

    if (snap.empty) {
      lista.innerHTML = "<p>Você ainda não possui seguidores.</p>";
      return;
    }

    for (const doc of snap.docs) {
      const uidSeguidor = doc.id;

      const perfil = await db
        .collection("usuarios")
        .doc(uidSeguidor)
        .get();

      if (!perfil.exists) continue;

      const dados = perfil.data();

      const nome =
        dados.nickname ||
        dados.nome ||
        `Usuário ${uidSeguidor}`;

      let avatar = "avatar_default.png";

      if (dados.avatarUpload) {
        avatar = dados.avatarUpload;
      } else if (
        dados.avatarEquipado &&
        dados.avatarEquipado.valor
      ) {
        avatar = dados.avatarEquipado.valor;
      } else if (dados.avatar) {
        avatar = dados.avatar;
      }

      const usuario = document.createElement("div");
      usuario.className = "usuario";

      const imagem = document.createElement("img");
      imagem.src = avatar;
      imagem.alt = "Foto de perfil";

      imagem.onerror = () => {
        imagem.src = "avatar_default.png";
      };

      const seguindo = await verificarSeguimento(uidSeguidor);

      if (String(uidSeguidor) !== meuUID && !seguindo) {
        const btn = document.createElement("button");

        btn.className = "follow-btn";
        btn.textContent = "Seguir";

        btn.onclick = async () => {
          btn.disabled = true;

          const sucesso = await seguirUsuario(uidSeguidor);

          if (sucesso) {
            btn.remove();
          } else {
            btn.disabled = false;
          }
        };

        usuario.appendChild(imagem);
        usuario.appendChild(btn);

      } else {
        usuario.appendChild(imagem);
      }

      const nomeUsuario = document.createElement("span");
      nomeUsuario.textContent = nome;

      usuario.appendChild(nomeUsuario);
      lista.appendChild(usuario);
    }

  } catch (erro) {
    console.error("Erro ao carregar seguidores:", erro);

    lista.innerHTML =
      "<p>Não foi possível carregar seus seguidores.</p>";
  }
}

carregarSeguidores();
</script>

</body>
</html>
